plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinite.chmproto'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinite.chmproto'
        minSdk 26
        targetSdk 35
        versionCode 44
        versionName '0.2.41'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


